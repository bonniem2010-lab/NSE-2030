[project]
name = "stock-analyst"
version = "0.1.0"
description = "Personal tool that tracks global stock prices and recommends buy/hold/sell with reasons."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stock-analyst = "stock_analyst.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stock_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
